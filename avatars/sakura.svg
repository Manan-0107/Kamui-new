<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="sakuraBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="60%" stop-color="#24030d"/>
      <stop offset="100%" stop-color="#0a0104"/>
    </radialGradient>
    <linearGradient id="sakuraSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ed"/>
      <stop offset="60%" stop-color="#fee7d6"/>
      <stop offset="100%" stop-color="#fcd5be"/>
    </linearGradient>
    <linearGradient id="sakuraHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="80%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#9d174d"/>
    </linearGradient>
    <linearGradient id="sakuraEyes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="sakuraShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#sakuraBg)" stroke="#f472b6" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="72" fill="none" stroke="rgba(244,114,182,0.25)" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Back Short Pink Hair -->
  <path d="M36 68 Q20 92 28 122 Q46 130 80 130 Q114 130 132 122 Q140 92 124 68 Z" fill="url(#sakuraHair)" filter="url(#sakuraShadow)"/>

  <!-- Shoulders & Red Ninja Top (Shippuden) -->
  <g id="sakuraBody">
    <path d="M34 136 Q80 118 126 136 L130 156 L30 156 Z" fill="#be123c"/>
    <!-- White Zipper Center Line -->
    <path d="M54 130 L80 154 L106 130 L110 156 L50 156 Z" fill="#e11d48"/>
    <line x1="80" y1="130" x2="80" y2="156" stroke="#f8fafc" stroke-width="2"/>
    <!-- Exposed Neck -->
    <path d="M66 124 L80 138 L94 124 Z" fill="url(#sakuraSkin)"/>
  </g>

  <!-- Chibi Head & Neck -->
  <rect x="73" y="112" width="14" height="18" rx="6" fill="url(#sakuraSkin)"/>
  <path d="M42 82 C40 106 56 122 80 122 C104 122 120 106 118 82 C116 60 102 52 80 52 C58 52 44 60 42 82 Z" fill="url(#sakuraSkin)" filter="url(#sakuraShadow)"/>

  <!-- Cheerful Rosy Blush -->
  <ellipse cx="56" cy="97" rx="8" ry="4" fill="#fb7185" opacity="0.5"/>
  <ellipse cx="104" cy="97" rx="8" ry="4" fill="#fb7185" opacity="0.5"/>

  <!-- Bright Emerald-Green Anime Eyes -->
  <!-- Left Eye -->
  <ellipse cx="63" cy="84" rx="8.5" ry="11" fill="url(#sakuraEyes)"/>
  <ellipse cx="63" cy="83" rx="5.5" ry="7" fill="#064e3b"/>
  <circle cx="60.5" cy="79.5" r="3.2" fill="#ffffff"/>
  <circle cx="66" cy="88" r="1.8" fill="#ffffff"/>
  <path d="M52 74 Q63 69 73 74" stroke="#18181b" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M72 73 L76 71" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Eye -->
  <ellipse cx="97" cy="84" rx="8.5" ry="11" fill="url(#sakuraEyes)"/>
  <ellipse cx="97" cy="83" rx="5.5" ry="7" fill="#064e3b"/>
  <circle cx="94.5" cy="79.5" r="3.2" fill="#ffffff"/>
  <circle cx="100" cy="88" r="1.8" fill="#ffffff"/>
  <path d="M87 74 Q97 69 108 74" stroke="#18181b" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M107 74 L111 71" stroke="#18181b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Energetic Sweet Smile -->
  <path d="M72 102 Q80 108 88 102" stroke="#e11d48" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Red Konoha Headband Worn as Hairband -->
  <g id="sakuraHeadband">
    <!-- Red Cloth -->
    <path d="M42 54 Q80 46 118 54 L119 64 Q80 56 41 64 Z" fill="#dc2626" stroke="#991b1b" stroke-width="0.8"/>
    <!-- Metal Plate -->
    <rect x="58" y="52" width="44" height="13" rx="3" fill="url(#metalPlate)" stroke="#475569" stroke-width="0.8"/>
    <!-- Leaf Spiral Crest -->
    <path d="M80 55 C78 55 76 56.5 76 58 C76 60 78 60.5 80 60.5 C82 60.5 83.5 59 83.5 58 C83.5 56 81.5 54.5 79 54.5 C75.5 54.5 73.5 57 73.5 59.5 C73.5 62 77 63.5 80 63.5 L84 62" fill="none" stroke="#1e293b" stroke-width="1.1" stroke-linecap="round"/>
  </g>

  <!-- Pink Front Bangs & Side Locks -->
  <path d="M42 60 Q60 48 80 48 Q100 48 118 60 Q124 82 120 106 Q114 104 110 86 Q100 68 80 72 Q60 68 50 86 Q46 104 40 106 Q36 82 42 60 Z" fill="url(#sakuraHair)" filter="url(#sakuraShadow)"/>
  <!-- Glossy Highlights -->
  <path d="M54 52 Q80 46 106 52" stroke="#fdf2f8" stroke-width="2" fill="none" opacity="0.8"/>
</svg>
