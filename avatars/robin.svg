<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="robinBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0f0d26"/>
      <stop offset="100%" stop-color="#050410"/>
    </radialGradient>
    <linearGradient id="robinSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5ed"/>
      <stop offset="60%" stop-color="#fde2d2"/>
      <stop offset="100%" stop-color="#f8ccb6"/>
    </linearGradient>
    <linearGradient id="robinHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="robinEyes" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="sunglassesGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="robinShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#robinBg)" stroke="#818cf8" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="72" fill="none" stroke="rgba(129,140,248,0.25)" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Back Flowing Raven Hair -->
  <path d="M34 68 Q18 96 24 136 Q48 144 80 144 Q112 144 136 136 Q142 96 126 68 Z" fill="url(#robinHair)" filter="url(#robinShadow)"/>

  <!-- Shoulders & Dark Blue Zip Vest / Top -->
  <g id="robinBody">
    <path d="M36 136 Q80 120 124 136 L128 156 L32 156 Z" fill="#1e3a8a"/>
    <!-- Deep V-Neck & Collarbones -->
    <path d="M58 128 L80 156 L102 128 L108 156 L52 156 Z" fill="#172554"/>
    <path d="M64 128 L80 148 L96 128" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
    <path d="M68 124 L80 140 L92 124 Z" fill="url(#robinSkin)"/>
    <path d="M72 132 Q80 140 88 132" stroke="#e09f7a" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Chibi Head & Neck -->
  <rect x="73" y="112" width="14" height="18" rx="6" fill="url(#robinSkin)"/>
  <path d="M42 82 C40 106 56 122 80 122 C104 122 120 106 118 82 C116 60 102 52 80 52 C58 52 44 60 42 82 Z" fill="url(#robinSkin)" filter="url(#robinShadow)"/>

  <!-- Elegant Rosy Blush -->
  <ellipse cx="56" cy="97" rx="8" ry="4" fill="#f43f5e" opacity="0.4"/>
  <ellipse cx="104" cy="97" rx="8" ry="4" fill="#f43f5e" opacity="0.4"/>

  <!-- Deep Azure Eyes with Elegant Long Lashes -->
  <!-- Left Eye -->
  <ellipse cx="63" cy="84" rx="8.5" ry="11" fill="url(#robinEyes)"/>
  <ellipse cx="63" cy="83" rx="5.5" ry="7" fill="#082f49"/>
  <circle cx="60.5" cy="79.5" r="3.2" fill="#ffffff"/>
  <circle cx="66" cy="88" r="1.8" fill="#ffffff"/>
  <path d="M52 74 Q63 69 73 74" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M72 73 L76 71" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Right Eye -->
  <ellipse cx="97" cy="84" rx="8.5" ry="11" fill="url(#robinEyes)"/>
  <ellipse cx="97" cy="83" rx="5.5" ry="7" fill="#082f49"/>
  <circle cx="94.5" cy="79.5" r="3.2" fill="#ffffff"/>
  <circle cx="100" cy="88" r="1.8" fill="#ffffff"/>
  <path d="M87 74 Q97 69 108 74" stroke="#0f172a" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M107 74 L111 72" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Elegant Subtle Smile -->
  <path d="M74 102 Q80 106 86 102" stroke="#be123c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Long Raven Hair with Center Parting & Forehead Waves -->
  <path d="M42 60 Q60 48 80 48 Q100 48 118 60 Q124 82 120 110 Q114 106 110 86 Q100 68 80 72 Q60 68 50 86 Q46 106 40 110 Q36 82 42 60 Z" fill="url(#robinHair)" filter="url(#robinShadow)"/>
  <!-- Indigo Gloss Sheen -->
  <path d="M54 52 Q80 46 106 52" stroke="#6366f1" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Robin's Signature Orange Sunglasses Propped on Forehead -->
  <g id="robinSunglasses" transform="translate(48, 44)" filter="url(#robinShadow)">
    <!-- Left Lens Frame -->
    <rect x="0" y="0" width="30" height="14" rx="4" fill="url(#sunglassesGrad)" stroke="#ea580c" stroke-width="1.2"/>
    <line x1="2" y1="3" x2="16" y2="3" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
    <!-- Bridge -->
    <rect x="29" y="4" width="6" height="3" fill="#ea580c"/>
    <!-- Right Lens Frame -->
    <rect x="34" y="0" width="30" height="14" rx="4" fill="url(#sunglassesGrad)" stroke="#ea580c" stroke-width="1.2"/>
    <line x1="36" y1="3" x2="50" y2="3" stroke="#ffffff" stroke-width="1" opacity="0.8"/>
  </g>
</svg>
