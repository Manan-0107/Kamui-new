<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="hinataBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="60%" stop-color="#170733"/>
      <stop offset="100%" stop-color="#090214"/>
    </radialGradient>
    <linearGradient id="hinataSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="60%" stop-color="#fee7d6"/>
      <stop offset="100%" stop-color="#fcd5be"/>
    </linearGradient>
    <linearGradient id="hinataHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#0f0d26"/>
      <stop offset="100%" stop-color="#050410"/>
    </linearGradient>
    <linearGradient id="byakuganGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="80%" stop-color="#c7d2fe"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="hinataShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base & Outer Ring -->
  <circle cx="80" cy="80" r="76" fill="url(#hinataBg)" stroke="#c084fc" stroke-width="2.5"/>
  <circle cx="80" cy="80" r="72" fill="none" stroke="rgba(192,132,252,0.25)" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Back Flowing Indigo Hair (Hime cut) -->
  <path d="M34 68 Q18 96 24 136 Q48 144 80 144 Q112 144 136 136 Q142 96 126 68 Z" fill="url(#hinataHair)" filter="url(#hinataShadow)"/>

  <!-- Shoulders & Lavender Jacket -->
  <g id="hinataBody">
    <path d="M36 136 Q80 120 124 136 L128 156 L32 156 Z" fill="#c084fc"/>
    <!-- Cream Hood / Collar Trim -->
    <path d="M48 132 Q80 124 112 132 L116 156 L44 156 Z" fill="#f5f3ff"/>
    <!-- Front Zipper & Purple Stripe -->
    <path d="M68 128 L80 140 L92 128 L94 156 L66 156 Z" fill="#818cf8"/>
    <line x1="80" y1="138" x2="80" y2="156" stroke="#4338ca" stroke-width="1.5"/>
  </g>

  <!-- Chibi Head & Neck -->
  <rect x="73" y="112" width="14" height="18" rx="6" fill="url(#hinataSkin)"/>
  <path d="M42 82 C40 106 56 122 80 122 C104 122 120 106 118 82 C116 60 102 52 80 52 C58 52 44 60 42 82 Z" fill="url(#hinataSkin)" filter="url(#hinataShadow)"/>

  <!-- Adorable Rosy Anime Blush with subtle hash marks -->
  <ellipse cx="56" cy="97" rx="8" ry="4.5" fill="#f43f5e" opacity="0.45"/>
  <line x1="53" y1="95" x2="55" y2="99" stroke="#e11d48" stroke-width="1" opacity="0.6"/>
  <line x1="57" y1="95" x2="59" y2="99" stroke="#e11d48" stroke-width="1" opacity="0.6"/>
  
  <ellipse cx="104" cy="97" rx="8" ry="4.5" fill="#f43f5e" opacity="0.45"/>
  <line x1="101" y1="95" x2="103" y2="99" stroke="#e11d48" stroke-width="1" opacity="0.6"/>
  <line x1="105" y1="95" x2="107" y2="99" stroke="#e11d48" stroke-width="1" opacity="0.6"/>

  <!-- Luminous Byakugan Pearl Eyes (Intricate Lavender Iris) -->
  <!-- Left Eye -->
  <ellipse cx="63" cy="84" rx="8.5" ry="11" fill="url(#byakuganGlow)"/>
  <ellipse cx="63" cy="84" rx="6.5" ry="9" fill="none" stroke="#818cf8" stroke-width="0.8"/>
  <circle cx="63" cy="84" r="3" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="60.5" cy="80.5" r="3.2" fill="#ffffff"/>
  <circle cx="66" cy="88" r="1.6" fill="#ffffff"/>
  <path d="M53 74 Q63 70 73 74" stroke="#1e1b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Right Eye -->
  <ellipse cx="97" cy="84" rx="8.5" ry="11" fill="url(#byakuganGlow)"/>
  <ellipse cx="97" cy="84" rx="6.5" ry="9" fill="none" stroke="#818cf8" stroke-width="0.8"/>
  <circle cx="97" cy="84" r="3" fill="#c7d2fe" opacity="0.7"/>
  <circle cx="94.5" cy="80.5" r="3.2" fill="#ffffff"/>
  <circle cx="100" cy="88" r="1.6" fill="#ffffff"/>
  <path d="M87 74 Q97 70 107 74" stroke="#1e1b4b" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Shy Sweet Anime Smile -->
  <path d="M75 102 Q80 105 85 102" stroke="#e11d48" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Classic Hime Cut Bangs & Glossy Locks -->
  <path d="M42 60 Q60 48 80 48 Q100 48 118 60 Q124 82 122 110 Q116 110 112 88 Q110 72 100 72 Q80 72 60 72 Q50 72 48 88 Q44 110 38 110 Q36 82 42 60 Z" fill="url(#hinataHair)" filter="url(#hinataShadow)"/>
  <!-- Straight front bang fringe with cut lines -->
  <rect x="52" y="60" width="56" height="15" fill="url(#hinataHair)"/>
  <line x1="52" y1="75" x2="108" y2="75" stroke="#4338ca" stroke-width="1.5"/>
  <!-- Glossy Sheen Highlight -->
  <path d="M54 52 Q80 48 106 52" stroke="#818cf8" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.8"/>
</svg>
