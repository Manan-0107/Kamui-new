      <stop offset="0%" stop-color="#1b382b"/>
      <stop offset="100%" stop-color="#08140e"/>
    </radialGradient>
    <linearGradient id="tsunadeHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
