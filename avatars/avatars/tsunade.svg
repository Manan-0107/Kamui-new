  <ellipse cx="102" cy="95" rx="6.5" ry="3" fill="#ff7675" opacity="0.4"/>
  
  <!-- Amber/Hazel Eyes -->
  <!-- Left Eye -->
  <ellipse cx="64" cy="85" rx="8.5" ry="10" fill="#b7791f"/>
  <ellipse cx="64" cy="87" rx="6.5" ry="7" fill="#d69e2e"/>
